name: Update site

on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job 1: gather the edition and package the site
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install feedparser requests
      - name: Gather the latest edition
        run: python scripts/update.py
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          DPLA_API_KEY: ${{ secrets.DPLA_API_KEY }}
      - name: Save this edition as a back issue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/archive
          git diff --cached --quiet || git commit -m "Back issue $(date -u +%F-%H%M) [skip ci]"
          git pull --rebase --autostash || true
          git push || echo "Could not save the back issue this time."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Job 2: publish it, only after job 1 has finished packaging
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
